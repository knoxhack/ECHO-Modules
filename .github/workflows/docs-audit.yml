name: Docs Audit

on:
  push:
  pull_request:

jobs:
  docs-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-module-release.test.mjs
      - run: node scripts/verify-module-release.mjs --skip-real
      - run: node scripts/release-workflow-audit.mjs
      - run: node scripts/validate-module-graph.mjs
      - run: node scripts/docs-audit.mjs
