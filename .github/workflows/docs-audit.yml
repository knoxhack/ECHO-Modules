name: Docs Audit

on:
  push:
  pull_request:

jobs:
  docs-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ECHO-Modules
      - uses: actions/checkout@v4
        with:
          repository: knoxhack/ECHO-SDK
          path: ECHO-SDK
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/generate-module-release.test.mjs
        working-directory: ECHO-Modules
      - run: node scripts/verify-module-release.mjs
        working-directory: ECHO-Modules
      - run: node scripts/validate-content-graph.mjs --strict --sdk-root ../ECHO-SDK
        working-directory: ECHO-Modules
      - run: node scripts/release-workflow-audit.mjs
        working-directory: ECHO-Modules
      - run: node scripts/validate-module-graph.mjs
        working-directory: ECHO-Modules
      - run: node scripts/docs-audit.mjs
        working-directory: ECHO-Modules
