modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/knoxhack/Echo/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/knoxhack/Echo"
authors="KnoxHack"
credits="Diagnostics and validation contracts for the ECHO ecosystem."
description='''
ECHO: ValidationCore defines diagnostic, validation, repair suggestion,
human-readable rendering, and JSON-ready report contracts for ECHO modules,
packs, schemas, runtime health, AI tasks, and bridge integrations.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echocore"
type="required"
reason="Provides the base ECHO core service layer."
versionRange="[0.1.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoplatformcore"
type="required"
reason="Provides platform unit, feature, side, stability, and ownership contracts."
versionRange="[0.1.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoschemacore"
type="required"
reason="Provides schema descriptor and document kind contracts used by validation targets."
versionRange="[0.1.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoadaptercore"
type="optional"
reason="Provides shared AdapterCore runtime bridges for NeoForge, ECHO Native, and Standalone parity."
versionRange="[0.1.0,)"
ordering="NONE"
side="BOTH"
