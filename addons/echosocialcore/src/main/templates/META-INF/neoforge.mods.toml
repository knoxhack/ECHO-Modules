modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/knoxhack/Echo/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/knoxhack/Echo"
authors="KnoxHack"
credits="Neutral faction, dialogue, NPC profile, and villager replacement plan contracts for the ECHO ecosystem."
description='''
ECHO: SocialCore defines neutral faction, reputation, dialogue tree, NPC
profile, AI profile, binding, and villager replacement plan contracts for
NPCore, MissionCore, ProgressionCore, PackOS, validators, AI tooling, and
future ECHO Native reports.
'''

