plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
def signalOsContentNamespace = (project.findProperty('content_namespace') ?: 'signalos').toString()

neoForge {
    version = project.neo_version

    runs {
        signalosClient {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', signalOsContentNamespace
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', signalOsContentNamespace
        }
        gameTestServer {
            type = "gameTestServer"
            programArguments.addAll '--tests', (project.findProperty('echoGameTestSelector') ?: "${signalOsContentNamespace}:*").toString()
            systemProperty 'neoforge.enabledGameTestNamespaces', signalOsContentNamespace
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.test)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

def providerJarFile = { providerPath ->
    def providerProject = rootProject.project(providerPath)
    def artifactBaseName = providerProject.findProperty("mod_id")?.toString() ?: providerProject.name
    def artifactVersion = providerProject.findProperty("mod_version")?.toString() ?: providerProject.version.toString()
    providerProject.layout.buildDirectory.file("libs/${artifactBaseName}-${artifactVersion}.jar")
}
def signalOsCompileProviderPaths = (findProperty('compileProviderPaths') ?: '')
        .toString()
        .split(',')
        .collect { it.trim() }
        .findAll { !it.isBlank() }

dependencies {
    implementation project(':echoadaptercore')
    implementation project(':echocore')
    implementation project(':echonetcore')
    compileOnly project(':echorendercore')
    compileOnly project(':echoscreencore')
    signalOsCompileProviderPaths.each { providerPath ->
        compileOnly files(providerJarFile(providerPath))
    }
    localRuntime project(':echorendercore')
    localRuntime project(':echoscreencore')
    localRuntime "org.jline:jline-reader:3.20.0"
    localRuntime "org.jline:jline-terminal:3.20.0"
}

tasks.named("compileJava").configure {
    signalOsCompileProviderPaths.each { providerPath ->
        dependsOn "${providerPath}:jar"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
