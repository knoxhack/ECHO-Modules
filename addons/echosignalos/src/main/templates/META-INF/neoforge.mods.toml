license="${mod_license}"
issueTrackerURL="https://github.com/knoxhack/Echo/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/knoxhack/Echo"
authors="KnoxHack"
credits="Reusable tactical terminal framework extracted from the ECHO stack."
description='''
SignalOS provides a reusable in-game terminal framework with chapters, missions, archives, rewards, diagnostics, Java APIs, and datapack JSON content.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echocore"
type="required"
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echonetcore"
type="required"
reason="Provides shared ECHO packet registration, safe sends, sync, and action rate limiting."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echorendercore"
type="optional"
reason="Enables RenderCore V18 terminal, rack, and screen chrome visual profiles."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoscreencore"
type="optional"
reason="Enables the ScreenCore embedded SignalNet browser surface inside the SignalOS desktop shell."
versionRange="[1.0.0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="kubejs"
type="optional"
reason="Enables optional KubeJS-facing SignalOS content hooks when KubeJS is installed."
versionRange="[7.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoadaptercore"
type="required"
reason="Provides shared AdapterCore runtime bridges for NeoForge, ECHO Native, and Standalone parity."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"
