license="${mod_license}"
issueTrackerURL="https://github.com/knoxhack/Echo/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/knoxhack/Echo"
authors="KnoxHack"
credits="Shared multiblock, blueprint, robotic automation, and facility runtime framework for the ECHO ecosystem."
description='''
ECHO: MultiblockCore provides data-driven multiblock definitions, validation,
formed-state runtime caching, controller diagnostics, blueprints, robotic arms,
workcells, task queues, integrity state, and optional ECHO integration hooks.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echocore"
type="required"
reason="Provides shared ECHO addon, map, mission, discovery, and service APIs."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echonetcore"
type="required"
reason="Provides shared ECHO packet registration and sync helpers."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoruntimeguard"
type="optional"
reason="Enables performance budget diagnostics for multiblock validation, auto-builder actions, and facility runtime."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoterminal"
type="optional"
reason="Adds MultiblockCore facility dashboard, recipe index, queue actions, and progression summaries to Terminal."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoholomap"
type="optional"
reason="HoloMap can display tiered multiblock facility markers and warning context through ECHO Core map providers."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echolens"
type="optional"
reason="Lens can inspect multiblock controllers, robotic components, capability bottlenecks, and build issues through optional providers."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echorendercore"
type="optional"
reason="Enables RenderCore multiblock controller and robotic arm visual anchors with vanilla-safe fallbacks."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echomissioncore"
type="optional"
reason="Registers the MultiblockCore 1.3 facility onboarding route when present."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echodatacore"
type="optional"
reason="Allows DataCore consumers to mirror public facility runtime snapshots without direct save access."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoindex"
type="optional"
reason="Allows Index surfaces to cross-link multiblock recipes, materials, and progression facts."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoindustrialnexus"
type="optional"
reason="Allows Industrial Nexus to consume shared multiblock recipes, upgrades, and facility snapshots."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoconvoyprotocol"
type="optional"
reason="Allows Convoy Protocol to hook depot and vehicle-gantry automation effects."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoagriculturereclamation"
type="optional"
reason="Allows Agriculture Reclamation to consume dome growth-matrix recipes and provider snapshots."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoarmory"
type="optional"
reason="Allows Armory to hook fabricator pattern automation through effect/provider contracts."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoorbitalremnants"
type="optional"
reason="Allows Orbital Remnants to read launch-platform readiness through public facility snapshots."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echopowergrid"
type="optional"
reason="Allows PowerGrid to satisfy multiblock power capability requirements through shared providers."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoadaptercore"
type="required"
reason="Provides shared AdapterCore runtime bridges for NeoForge, ECHO Native, and Standalone parity."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"
