modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/knoxhack/Echo/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/knoxhack/Echo"
authors="KnoxHack"
credits="AI task, prompt bundle, safe command, and run report contracts for the ECHO ecosystem."
description='''
ECHO: AgentCore defines AI task, prompt bundle, project graph, protected file,
safe command, diagnostic hint, and run report contracts for Codex, CyberDex,
Command Center, Launcher, and future ECHO Native workflows.
'''

