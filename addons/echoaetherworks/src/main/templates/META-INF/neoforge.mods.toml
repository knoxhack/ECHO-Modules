modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/knoxhack/echo/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/knoxhack/echo"
authors="KnoxHack"
credits="Aether machine module for ECHO: Arcana Division."
description='''
ECHO: AetherWorks defines the Arcana Division machine automation module for
aether storage, conduits, fabrication, spell engraving, relic charging, and
contamination diagnostics.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echocore"
type="required"
reason="Provides shared ECHO addon registry and module catalog contracts."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoarcanacore"
type="required"
reason="Provides Aether machine provider contracts for Arcana Division."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echospellcore"
type="optional"
reason="Future Spell Engraver output will create and tune SpellCore spell cores."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echocursecore"
type="optional"
reason="Future Purification Matrix behavior will cleanse cursed aether and curse contamination."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echorelictech"
type="optional"
reason="Future Relic Charger behavior will charge and risk-manage RelicTech relics."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoritualcore"
type="optional"
reason="Future Ritual Automator behavior will feed RitualCore arrays without removing ritual risk."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"
