modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/knoxhack/Echo/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/knoxhack/Echo"
authors="KnoxHack"
credits="Local-first bridge session, job, streaming log, safe action, heartbeat, and transport contracts for the ECHO ecosystem."
description='''
ECHO: BridgeCore defines neutral low-latency bridge contracts for Android
CyberDex, PC bridge services, Codex CLI sessions, Command Center, and future
ECHO Native tooling. It models safe action requests and confirmations but does
not execute arbitrary commands.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echocore"
type="required"
reason="Provides the base ECHO core service layer."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoplatformcore"
type="required"
reason="Provides module identity, runtime side, role, and feature contracts."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echovalidationcore"
type="required"
reason="Provides diagnostic vocabulary for bridge jobs and safe actions."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echohealthcore"
type="required"
reason="Provides local runtime health status for bridge heartbeat and agent state."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoagentcore"
type="required"
reason="Provides AI task, prompt bundle, and safe command contracts consumed by bridge jobs."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoadaptercore"
type="required"
reason="Provides shared AdapterCore runtime bridges for NeoForge, ECHO Native, and Standalone parity."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"
