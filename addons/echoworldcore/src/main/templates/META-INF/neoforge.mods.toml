versionRange="[0.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echomissioncore"
type="optional"
reason="Consumes WorldCore runtime events for region, marker, scan, and hazard objectives when present."
versionRange="[0.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echosoundcore"
type="optional"
reason="Receives WorldCore region and hazard context for ambience and music selection when present."
versionRange="[0.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echotutorialcore"
type="optional"
reason="Uses WorldCore hazard context for contextual player guidance when present."
versionRange="[0.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoruntimeguard"
type="optional"
reason="Can surface WorldCore diagnostics, scan cadence, marker counts, and validation warnings when present."
versionRange="[0.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoadaptercore"
type="required"
reason="Provides shared AdapterCore runtime bridges for NeoForge, ECHO Native, and Standalone parity."
versionRange="[0.1.0,)"
ordering="AFTER"
side="BOTH"
