license="${mod_license}"
issueTrackerURL="https://github.com/knoxhack/echo/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/knoxhack/ECHO-Modules"
authors="KnoxHack"
credits="Built as Official ECHO Pack #3."
description='''
ECHO: Sky Relay Protocol provides the data-first contract for restoring a broken
atmospheric relay network above a lethal storm layer. NeoForge is a compatibility
target; Echo data IDs remain the source of truth for Native and Standalone parity.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echocore"
type="required"
reason="Provides shared ECHO addon and pack-root services."
versionRange="[0.1.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echonetcore"
type="required"
reason="Provides shared sync and multiplayer contracts for relay state."
versionRange="[0.1.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoadaptercore"
type="required"
reason="Keeps Sky Relay parity routed through Echo contracts instead of runtime-specific code."
versionRange="[0.1.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoruntimeguard"
type="required"
reason="Guards release-mode behavior and runtime activation for official pack roots."
versionRange="[0.1.0,)"
ordering="AFTER"
side="BOTH"
