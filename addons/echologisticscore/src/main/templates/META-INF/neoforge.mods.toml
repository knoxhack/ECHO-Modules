authors="KnoxHack"
credits="Shared routing, storage, delivery, ownership, and convoy integration contracts for the ECHO ecosystem."
description='''
ECHO: LogisticsCore defines neutral item, fluid, signal, storage node, route,
delivery job, network ownership, and convoy integration reference contracts.
'''

