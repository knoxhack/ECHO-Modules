plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        recoveryClient { client(); systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        server { server(); programArgument '--nogui'; systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.addAll '--tests', "${project.mod_id}:*"
        }
        data { clientData(); programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath() }
        configureEach { systemProperty 'forge.logging.markers', 'REGISTRIES'; logLevel = org.slf4j.event.Level.DEBUG }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main); sourceSet(sourceSets.test) } }
}

configurations { runtimeClasspath.extendsFrom localRuntime }
def includeOptionalRuntime = providers.gradleProperty("echoRecoveryWithIntegrations")
    .map { value -> value.toBoolean() }
    .orElse(false)
    .get()
def optionalProject = { String path, String configuration ->
    def candidate = rootProject.findProject(path)
    if (candidate != null) {
        dependencies.add(configuration, candidate)
    }
}
def optionalCompile = { String path -> optionalProject(path, "compileOnly") }
def optionalRuntime = { String path ->
    if (includeOptionalRuntime) {
        optionalProject(path, "localRuntime")
    }
}
dependencies {
    implementation project(":echocore")
    implementation project(":echonetcore")
    compileOnly project(":echoadaptercore")
    localRuntime project(":echoadaptercore")
    compileOnly project(":echoplatformcore")
    compileOnly project(":echovalidationcore")
    compileOnly project(":echopackcore")
    compileOnly project(":echohealthcore")
    compileOnly project(":echomodulegraph")
    optionalCompile(":echoterminal")
    optionalRuntime(":echoterminal")
    optionalCompile(":echothemecore")
    optionalRuntime(":echothemecore")
    optionalCompile(":echodatacore")
    optionalRuntime(":echodatacore")
    optionalCompile(":echomissioncore")
    optionalRuntime(":echomissioncore")
    optionalCompile(":echotutorialcore")
    optionalRuntime(":echotutorialcore")
    optionalCompile(":echosoundcore")
    optionalRuntime(":echosoundcore")
    optionalCompile(":echoworldcore")
    optionalRuntime(":echoworldcore")
    optionalCompile(":echoruntimeguard")
    optionalRuntime(":echoruntimeguard")
    optionalCompile(":echoholomap")
    optionalRuntime(":echoholomap")
    optionalCompile(":echoindex")
    optionalRuntime(":echoindex")
    optionalCompile(":echoweathercore")
    optionalRuntime(":echoweathercore")
    optionalCompile(":echolens")
    optionalRuntime(":echolens")
    optionalCompile(":echoarmory")
    optionalRuntime(":echoarmory")
