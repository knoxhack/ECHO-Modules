license="${mod_license}"
issueTrackerURL="https://github.com/knoxhack/echo/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/knoxhack/ECHO-Modules"
authors="KnoxHack"
credits="Built as a high-ceiling official ECHO survey pack."
description='''
ECHO: Galactic Survey Protocol provides the data-first contract for rebuilding a
long-range survey network, launching probes, plotting fuel-safe routes, salvaging
orbital wreckage, and cataloging strange worlds. NeoForge is a compatibility
target; ECHO data IDs remain the source of truth for Native and Standalone
parity.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echocore"
type="required"
reason="Provides shared ECHO addon and pack-root services."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echonetcore"
type="required"
reason="Provides shared sync and multiplayer contracts for survey state."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoadaptercore"
type="required"
reason="Keeps Galactic Survey parity routed through ECHO contracts instead of runtime-specific code."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoruntimeguard"
type="required"
reason="Guards release-mode behavior and runtime activation for official pack roots."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"
