[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/knoxhack/Echo"
authors="KnoxHack"
credits="Neutral notification, toast, alert, tutorial hint, priority, severity, duration, and delivery-state contracts for ECHO."
