plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id
def echoEnableJeiCompat = providers.gradleProperty('echoEnableJeiCompat')
        .map { it.toBoolean() }
        .orElse(false)
        .get()

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
if (!echoEnableJeiCompat) {
    sourceSets.main.java.exclude 'com/knoxhack/echonexusprotocol/compat/jei/NexusJeiCategory.java'
    sourceSets.main.java.exclude 'com/knoxhack/echonexusprotocol/compat/jei/NexusJeiPlugin.java'
    sourceSets.main.java.exclude 'com/knoxhack/echonexusprotocol/compat/jei/NexusJeiRecipeTypes.java'
}

repositories {
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroupAndSubgroups('com.geckolib') }
    }
}

neoForge {
    version = project.neo_version
    runs {
        nexusClient { client(); systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        server { server(); programArgument '--nogui'; systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArguments.addAll '--tests', (project.findProperty('echoGameTestSelector') ?: "${project.mod_id}:*").toString()
        }
        configureEach { systemProperty 'forge.logging.markers', 'REGISTRIES'; logLevel = org.slf4j.event.Level.DEBUG }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main); sourceSet(sourceSets.test) } }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    implementation project(':echocore')
    implementation project(':echoadaptercore')
    compileOnly project(':echoterminal')
    compileOnly project(':echorendercore')
    compileOnly project(":echomachinecore")
    compileOnly project(":echoassetcore")
    localRuntime project(':echoterminal')
    localRuntime project(':echorendercore')
    localRuntime project(':echoorbitalremnants')
    localRuntime project(":echomachinecore")
    localRuntime project(":echoassetcore")
    if (echoEnableJeiCompat) {
        if (!project.hasProperty('jei_version')) {
            throw new GradleException('Set jei_version when enabling Nexus JEI compat with -PechoEnableJeiCompat=true.')
        }
        compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
