modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/knoxhack/Echo/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/knoxhack/Echo"
authors="KnoxHack"
credits="ScreenCore-powered survival codex, datapack article loader, and ecosystem knowledge browser."
description='''
ECHO: Wiki provides the ScreenCore-powered ECHO Survival Codex: player-facing articles, discoveries, regions, hazards, missions, machines, factions, and addon knowledge links.
'''

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echocore"
type="required"
reason="Provides shared addon chapter registration, discoveries, missions, factions, regions, hazards, Index contracts, and no-op-safe services."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoscreencore"
type="required"
reason="Renders the Survival Codex through native EUI pages, data providers, actions, styles, tooltips, and responsive components."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoterminal"
type="optional"
reason="Adds a Terminal navigation tab that opens the ScreenCore Survival Codex when Terminal is installed."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoindex"
type="optional"
reason="Allows Wiki related item and recipe links to deep-link into Index detail pages when Index is installed."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoworldcore"
type="optional"
reason="Allows Wiki pages to display data-driven WorldCore regions, hazards, and current world context."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echomissioncore"
type="optional"
reason="Allows Wiki pages to display MissionCore chapters, missions, status-aware mission rows, and related guide links."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echotutorialcore"
type="optional"
reason="Allows TutorialCore guide content to be referenced from Survival Codex article collections."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echorelictech"
type="optional"
reason="Allows relic and vault guide pages to contribute or link ECHO Wiki articles through datapacks."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echopowergrid"
type="optional"
reason="Allows PowerGrid guide articles and machine-related Codex links to be contributed through datapacks."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoweathercore"
type="optional"
reason="Allows weather and hazard forecast guide articles to be contributed through datapacks."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoholomap"
type="optional"
reason="Reserves future map-marker related actions and lets HoloMap content link to Wiki region and route articles."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echolens"
type="optional"
reason="Reserves future Lens inspection shortcuts from Wiki related actions while keeping the Codex usable without Lens."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echothemecore"
type="optional"
reason="Allows installed ECHO themes to skin Wiki ScreenCore pages through shared ThemeCore tokens."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoadaptercore"
type="required"
reason="Provides shared AdapterCore runtime bridges for NeoForge, ECHO Native, and Standalone parity."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"
