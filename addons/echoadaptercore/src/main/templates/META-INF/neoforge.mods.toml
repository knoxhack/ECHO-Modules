modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/knoxhack/Echo/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/knoxhack/Echo"
authors="KnoxHack"
credits="Runtime adapter contracts for the ECHO ecosystem."
description='''
ECHO: AdapterCore describes how ECHO platform contracts map to the current
NeoForge runtime and the planned future ECHO Native runtime.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echocore"
type="optional"
reason="Provides the base ECHO core service layer."
versionRange="[0.1.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoplatformcore"
type="optional"
reason="Provides platform unit, feature, capability, and compatibility contracts."
versionRange="[0.1.0,)"
ordering="AFTER"
side="BOTH"
