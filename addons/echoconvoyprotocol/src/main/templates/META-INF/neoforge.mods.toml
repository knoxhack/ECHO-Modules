modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Knoxhack"
description='''Ruined-Earth convoy travel, vehicles, depot logistics, deterministic field operations, route contracts, fuel, cargo, checkpoints, and roadside threats for ECHO.'''

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echocore"
type="required"
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echonetcore"
type="required"
reason="Provides shared ECHO packet registration, safe sends, sync, and action rate limiting."
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echomultiblockcore"
type="required"
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoterminal"
type="optional"
reason="Adds Convoy route contracts, actions, and explicit route placement to the modular ECHO Terminal."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echologisticsnetwork"
type="optional"
reason="Shares cargo, delivery, depot, and loadout context with Logistics Network when present."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoholomap"
type="optional"
reason="Displays convoy routes, roadside contracts, checkpoints, and recovery signals on HoloMap when present."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echorendercore"
type="optional"
reason="Enables RenderCore visual profiles for convoy vehicles and route-facing visual polish when present."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="echoruntimeguard"
type="optional"
reason="Allows Convoy route, marker, and multiblock runtime work to honor shared runtime budgets when present."
versionRange="[1.0.0,)"
ordering="NONE"
side="BOTH"
