def echoSharedModuleProperties = [
        minecraft_version      : '1.21.1',
        minecraft_version_range: '[1.21.1,1.22)',
        neo_version            : '26.1.2.29-beta',
        neo_version_range      : '[26.1.2.29-beta,)',
        minecraftVersion       : '1.21.1',
        minecraftVersionRange  : '[1.21.1,1.22)',
        neoForgeVersion        : '26.1.2.29-beta',
        neoForgeVersionRange   : '[26.1.2.29-beta,)',
        loaderVersionRange     : '[4,)',
]

def echoForcedSharedModuleProperties = [
        'minecraft_version',
        'minecraft_version_range',
        'minecraftVersion',
        'minecraftVersionRange',
] as Set

gradle.beforeProject { project ->
    def propertiesFile = new File(project.projectDir, 'gradle.properties')
    if (propertiesFile.isFile()) {
        def moduleProperties = new Properties()
        propertiesFile.withInputStream { moduleProperties.load(it) }
        moduleProperties.each { key, value ->
            if (!project.hasProperty(String.valueOf(key))) {
                project.extensions.extraProperties.set(String.valueOf(key), value)
            }
        }
    }
    echoSharedModuleProperties.each { key, value ->
        if (echoForcedSharedModuleProperties.contains(String.valueOf(key)) || !project.hasProperty(String.valueOf(key))) {
            project.extensions.extraProperties.set(String.valueOf(key), value)
        }
    }
}

allprojects {
    repositories {
        mavenCentral()
        maven { url = uri('https://maven.neoforged.net/releases') }
        maven { url = uri('https://libraries.minecraft.net') }
    }
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.incremental = false
        }
        tasks.withType(Test).configureEach {
            failOnNoDiscoveredTests = false
        }
        sourceSets.named('test') {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
        }
    }
}

