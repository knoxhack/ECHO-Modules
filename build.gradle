tasks.register('buildEchoWorkspace') {
    group = 'build'
    description = 'Builds the selected runtime module closure used by Native, NeoForge, and Standalone release staging.'
    dependsOn {
        def requestedAddonSet = String.valueOf(project.findProperty('echoAddonSet') ?: 'ashfall')
        def moduleProjects = requestedAddonSet in ['all', 'beta']
                ? subprojects.findAll { new File(it.projectDir, 'src/main/resources/META-INF/echo.mod.json').isFile() }
                : ashfallRuntimeModules.collect { project(":${it}") }
        moduleProjects.collect { "${it.path}:jar" }
    }
}

