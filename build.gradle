tasks.register('validateReleaseArtifacts') {
    group = 'verification'
    description = 'Verifies required Ashfall modules emit compiled runtime jars under addons/<module>/build/libs.'
    dependsOn tasks.named('buildEchoWorkspace')
    doLast {
        def missing = []
        ashfallRequiredReleaseModules.each { moduleId ->
            def libsDir = file("addons/${moduleId}/build/libs")
            def jars = libsDir.isDirectory()
                    ? libsDir.listFiles().findAll { it.isFile() && it.name.endsWith('.jar') && !it.name.contains('-sources') && !it.name.contains('-javadoc') }
                    : []
            if (jars.empty) {
                missing.add("${moduleId} (${libsDir})")
            }
        }
        if (!missing.empty) {
            throw new GradleException("Missing compiled Ashfall module runtime jar(s): ${missing.join(', ')}")
        }
    }
}

tasks.register('generateAshfallRequiredModuleRelease', Exec) {
    group = 'release'
    description = 'Generates strict release artifacts for the Ashfall required module closure after compiled jars exist.'
    dependsOn tasks.named('validateReleaseArtifacts')
    commandLine 'node',
            'scripts/generate-module-release.mjs',
            '--release-id',
            'modules-v0.1.0-alpha',
            '--out',
            'dist/echo-module-release',
            '--module',
            'echocore',
            '--module',
            'echoplatformcore',
            '--module',
            'echoadaptercore',
            '--module',
            'echonetcore',
            '--module',
            'echoruntimeguard',
            '--module',
            'echolens',
            '--module',
            'echopresencelink',
            '--module',
            'echoterminal',
            '--module',
            'echoblockworks',
            '--module',
            'echoashfallprotocol'
    doLast {
        def releaseManifest = file('dist/echo-module-release/echo-release.json')
        if (!releaseManifest.isFile()) {
            throw new GradleException("Ashfall module release manifest was not generated: ${releaseManifest}")
        }

        def release = new groovy.json.JsonSlurper().parse(releaseManifest)
        def generatedModules = release.modules.collect { it.moduleId }
        if (generatedModules != ashfallRequiredReleaseModules) {
            throw new GradleException("Ashfall module release generated ${generatedModules}, expected ${ashfallRequiredReleaseModules}")
        }

        release.modules.each { moduleRecord ->
            def runtimeArtifacts = moduleRecord.artifacts.findAll { it.kind != 'sources' }
            if (runtimeArtifacts.empty) {
                throw new GradleException("${moduleRecord.moduleId} generated no runtime artifacts")
            }
            def sourcePackaged = runtimeArtifacts.findAll { it.buildMode != 'compiled-runtime' }
            if (!sourcePackaged.empty) {
                def names = sourcePackaged.collect { "${it.filename}:${it.buildMode}" }
                throw new GradleException("${moduleRecord.moduleId} has non-compiled runtime artifacts: ${names}")
            }
        }
    }
}

